[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Foco em bugs (pyflakes) e erros de sintaxe; estilo é opcional para não
# travar o CI num código legado.
select = ["E9", "F"]
# F841 = variável local não usada (muito legado pré-existente, remoção é arriscada)
ignore = ["F841"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
